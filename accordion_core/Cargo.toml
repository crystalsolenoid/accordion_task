[package]
name = "accordion_core"
version = "0.1.0"
edition = "2024"

[dependencies]
toml = "0.8.23"
chrono = { version = "0.4.41", features = ["serde"]}
color-eyre = "0.6.2"
csv = "1.3.1"
ratatui = { version = "0.29.0", optional = true }
reactive_stores = {version = "0.2.3", optional = true}
serde = { version = "1.0.219", features = ["derive"] }
# TODO wasm probably cant depend on csv's for routine defs?

[features]
web = ["dep:reactive_stores"]
ratatui = ["dep:ratatui"]
